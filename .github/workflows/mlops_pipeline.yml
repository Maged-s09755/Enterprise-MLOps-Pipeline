name: Final Enterprise MLOps Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  mlops_execution:
    runs-on: ubuntu-latest # التغيير هنا إلى ubuntu-latest لحل مشكلة حجز الخادم
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4 # يحل تحذير Node.js 20

    - name: Set up Python Environment
      uses: actions/setup-python@v5 # يحل تحذير Node.js 20
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      continue-on-error: true
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; else echo "No requirements.txt found, skipping..."; fi

    - name: Execute Data Drift Audit
      continue-on-error: true
      run: |
        if [ -f src/monitor.py ]; then python src/monitor.py; else echo "monitor.py not found, skipping..."; fi

    - name: Train and Track Model
      continue-on-error: true
      run: |
        if [ -f src/train.py ]; then python src/train.py; else echo "train.py not found, skipping..."; fi
concurrency:
