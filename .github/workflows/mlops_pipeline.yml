name: Enterprise MLOps CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  mlops_execution:
    runs-on: ubuntu-24.04 # 👈 تم تحديد الإصدار صراحة لإخفاء ملاحظة التحديث
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4 # 👈 تم التحديث إلى v4 لحل تحذير Node.js

    - name: Set up Python Environment
      uses: actions/setup-python@v5 # 👈 تم التحديث إلى v5 لحل تحذير Node.js
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Train and Track Model
      continue-on-error: true
      run: python src/train.py

    - name: Execute Data Drift Audit
      continue-on-error: true
      run: python src/monitor.py
      
