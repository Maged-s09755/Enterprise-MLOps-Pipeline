name: 🚀 Ultimate Enterprise MLOps CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # يسمح بتشغيل الـ Pipeline يدوياً من واجهة GitHub

permissions:
  contents: read
  packages: write

jobs:
  # ---------------------------------------------------------
  # المرحلة الأولى: فحص جودة الكود والأمان (Code Quality & Security)
  # ---------------------------------------------------------
  quality_and_security:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Quality Tools
      run: pip install black flake8 bandit

    - name: Code Formatting Check (Black)
      run: black --check src/

    - name: Syntax & Style Linting (Flake8)
      run: flake8 src/

    - name: Security Vulnerability Scan (Bandit)
      run: bandit -r src/

  # ---------------------------------------------------------
  # المرحلة الثانية: اختبارات الوحدة والبيانات (Testing)
  # ---------------------------------------------------------
  testing:
    needs: quality_and_security
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
    
    - name: Install Dependencies
      run: pip install -r requirements.txt pytest

    - name: Run Unit & Data Tests
      run: pytest tests/ -v

  # ---------------------------------------------------------
  # المرحلة الثالثة: صلب الـ MLOps (Data, Train, Track)
  # ---------------------------------------------------------
  mlops_core:
    needs: testing
    runs-on: ubuntu-latest
    env:
      # ربط الـ Pipeline بأدوات التتبع مثل MLflow أو Weights & Biases
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Production Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt dvc

    - name: Pull Data from Remote Storage (DVC)
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      run: dvc pull # سحب البيانات الضخمة من S3/GCP بدلاً من رفعها على GitHub

    - name: Execute Data Drift Audit
      run: python src/monitor.py

    - name: Train and Track Model
      run: python src/train.py

    - name: Upload Production Model Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: production-model-${{ github.sha }}
        path: models/
        retention-days: 30 # الاحتفاظ بالنموذج لمدة شهر

  # ---------------------------------------------------------
  # المرحلة الرابعة: التغليف والنشر (Continuous Delivery)
  # ---------------------------------------------------------
  delivery:
    needs: mlops_core
    if: github.ref == 'refs/heads/main' # تعمل فقط عند الدمج النهائي
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Download Model Artifacts
      uses: actions/download-artifact@v4
      with:
        name: production-model-${{ github.sha }}
        path: models/

    - name: Log in to GitHub Container Registry (GHCR)
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ghcr.io/${{ github.repository }}/ml-api:latest
