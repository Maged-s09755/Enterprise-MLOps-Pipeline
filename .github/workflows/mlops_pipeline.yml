name: Enterprise MLOps CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  mlops_execution:
    # تحديد الإصدار صراحة لحل ملاحظة ubuntu-latest
    runs-on: ubuntu-24.04 
    
    steps:
    - name: Checkout Repository
      # التحديث إلى الإصدار 4 لحل تحذير Node.js 20
      uses: actions/checkout@v4 

    - name: Set up Python Environment
      # التحديث إلى الإصدار 5 لحل تحذير Node.js 20
      uses: actions/setup-python@v5 
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute Data Drift Audit
      continue-on-error: true
      run: python src/monitor.py

    - name: Train and Track Model
      continue-on-error: true
      run: python src/train.py
